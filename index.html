<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2eb">
<title>Andamio · inglés por historias y capas IA</title>
<style>
:root{
  --ink:#1d2733; --muted:#5a6978; --paper:#f5f2eb; --card:#ffffff; --line:#d5dce3;
  --amber:#f0a500; --amber-ink:#2a1d00; --ok:#238251; --bad:#c0392b; --ai:#6d28d9;
  /* Colores elegantes en Modo Claro para las 5 plantas del andamiaje */
  --f0:#f6f4ef; /* Planta 0: Alabastro cálido */
  --f1:#e4effa; /* Planta 1 (Palabras clave): Azul cielo sereno */
  --f2:#e2f3ea; /* Planta 2 (Idea básica): Verde salvia suave */
  --f3:#fdf0d5; /* Planta 3 (Historia completa): Crema ámbar */
  --f4:#ede6f7; /* Planta 4 (En palabras simples): Lavanda editorial */
  /* Colores elegantes en Modo Claro según la pantalla activa */
  --m-library:#f4f1ea;
  --m-vocab:#fceee9;
  --m-practice:#e1f3f4;
  --m-index:#eef2f7;
  --m-progress:#f9f2df;
  --m-import:#e9ecf8;
  --m-settings:#ebf0f2;
  --fs:1;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=dark]{
  --ink:#e8edf2; --muted:#9aa8b5; --paper:#10161c; --card:#1a232c; --line:#2b3745;
  --amber:#f5b82e; --amber-ink:#2a1d00; --ok:#4cc38a; --bad:#ff7b6b; --ai:#a78bfa;
  --f0:#141b22;
  --f1:#152638;
  --f2:#14281e;
  --f3:#2b2415;
  --f4:#231d33;
  --m-library:#141b22;
  --m-vocab:#261a1b;
  --m-practice:#132629;
  --m-index:#161f29;
  --m-progress:#262115;
  --m-import:#191d2c;
  --m-settings:#172026;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fs))}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hidden{display:none!important}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--f0);transition:background .32s ease,color .2s ease}
/* Colores dinámicos por modo de pantalla */
#app[data-mode="library"]{background:var(--m-library)}
#app[data-mode="vocab"]{background:var(--m-vocab)}
#app[data-mode="practice"]{background:var(--m-practice)}
#app[data-mode="index"]{background:var(--m-index)}
#app[data-mode="progress"]{background:var(--m-progress)}
#app[data-mode="import"]{background:var(--m-import)}
#app[data-mode="settings"]{background:var(--m-settings)}
#app[data-mode="pron"]{background:var(--m-practice)}
/* Colores dinámicos por planta cuando se estudia una historia */
#app[data-mode="story"][data-floor="0"]{background:var(--f0)}
#app[data-mode="story"][data-floor="1"]{background:var(--f1)}
#app[data-mode="story"][data-floor="2"]{background:var(--f2)}
#app[data-mode="story"][data-floor="3"]{background:var(--f3)}
#app[data-mode="story"][data-floor="4"]{background:var(--f4)}

#top{position:relative;display:flex;align-items:center;gap:.45rem;padding:calc(env(safe-area-inset-top) + .5rem) .85rem .55rem;background:rgba(255,255,255,.72);background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#ctx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem;color:var(--muted)}
#ctx b{color:var(--ink);font-weight:700}
.warn{font-size:.73rem;background:var(--bad);color:#fff;border-radius:.6rem;padding:.15rem .5rem;white-space:nowrap}
.tbtn{height:2.2rem;border-radius:.75rem;border:1.5px solid var(--line);background:var(--card);padding:0 .55rem;display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:650;white-space:nowrap;transition:transform .12s,border-color .15s}
.tbtn:active{transform:scale(.96)}
.tbtn .kbadge{background:var(--amber);color:var(--amber-ink);border-radius:.4rem;padding:.05rem .35rem;font-size:.7rem;font-weight:800}
.tbtn .kbadge.off{background:var(--line);color:var(--muted)}
#prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}
#prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}

#stage{position:relative;overflow:hidden;touch-action:pan-y}
.slide{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;padding:.9rem 1.1rem 1rem;-webkit-overflow-scrolling:touch}
#app[data-rail] .slide{padding-left:2.35rem}
.slide>.in{margin-block:auto;margin-inline:auto;width:100%;max-width:35rem}

#rail{position:absolute;left:.65rem;top:1rem;bottom:1rem;width:1.2rem;display:none;flex-direction:column-reverse;justify-content:space-between;align-items:center;pointer-events:none;z-index:2}
#app[data-rail] #rail{display:flex}
#rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:var(--line);border-radius:2px}
#rail i{position:relative;width:.95rem;height:.3rem;border-radius:2px;background:var(--line)}
#rail i.on{background:var(--ink)}
#rail i.cur{width:1.2rem;background:var(--amber);box-shadow:0 0 0 2px var(--ink)}

#nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.8rem;padding:.6rem .95rem calc(.75rem + env(safe-area-inset-bottom));background:rgba(255,255,255,.65);background:color-mix(in srgb,var(--card) 65%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.nbtn{height:3.4rem;border-radius:1.1rem;border:2px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;gap:.35rem;font-weight:650;box-shadow:0 2px 0 var(--ink)}
.nbtn svg{width:1.3rem;height:1.3rem}
#next{background:var(--amber);color:var(--amber-ink)}
.nbtn:disabled{opacity:.3;box-shadow:none}
#menuBtn{width:3.4rem;height:3.4rem;border-radius:50%;border:2px solid var(--ink);background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation}
#menuBtn svg{width:1.4rem;height:1.4rem}

svg{width:1.1em;height:1.1em;flex:none}

.in h2{font-size:1.5rem;line-height:1.2;margin:0 0 .7rem;font-weight:750;text-wrap:balance}
.in h3{font-size:1rem;margin:1.1rem 0 .3rem}
.in p{margin:.3rem 0 .8rem}
.in ul{margin:.3rem 0 .8rem;padding-left:1.2rem}
.muted{color:var(--muted)}
.sm{font-size:.88rem}
.sent{font-family:var(--serif);font-size:1.65rem;line-height:1.4;text-wrap:pretty}
.in .sent.sm{font-size:1.05rem;line-height:1.5;color:var(--muted);margin:0 0 .9rem}
.big{font-family:var(--serif);font-size:1.45rem;line-height:1.45}
.story p{font-family:var(--serif);font-size:1.14rem;line-height:1.72;margin:0 0 1rem}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:3px solid var(--amber);border-radius:2px}
.term.on{background:color-mix(in srgb,var(--amber) 40%,transparent)}
.note{background:var(--card);border:1.5px solid var(--line);border-radius:1rem;padding:.75rem .95rem;margin-top:1rem;font-size:.95rem;min-height:3.2rem;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.note b{font-family:var(--serif)}
.chip{display:inline-flex;align-items:center;gap:.35rem;border-radius:2rem;padding:.22rem .75rem;font-size:.82rem;font-weight:650}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.ai{background:color-mix(in srgb,var(--ai) 16%,transparent);color:var(--ai)}
.msg{font-size:.92rem;min-height:1.4rem}
.msg.bad{color:var(--bad)} .msg.good{color:var(--ok)}

.row{display:flex;gap:.55rem;flex-wrap:wrap;margin:.55rem 0}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:.9rem;padding:.62rem .95rem;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;transition:transform .1s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--amber);color:var(--amber-ink)}
.btn.ai{border-color:var(--ai);color:var(--ai);background:color-mix(in srgb,var(--ai) 10%,var(--card))}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:.38rem .72rem;font-size:.86rem;border-radius:.75rem}
.btn:disabled{opacity:.4}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.busy{opacity:.75;pointer-events:none}
label.btn input{display:none}

.ta{width:100%;min-height:8.5rem;border-radius:.9rem;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:.7rem;font:inherit;resize:vertical}
.ta.one{min-height:0;height:2.85rem;font-size:1rem}
select.ta{min-height:0;height:2.85rem;padding-block:.35rem}

.defs{list-style:none;padding:0;margin:0;display:grid;gap:.55rem}
.in .defs{padding:0}
.defcard{background:var(--card);border:1.5px solid var(--line);border-radius:1rem;padding:.65rem .85rem;display:flex;flex-direction:column;gap:.4rem}
.defcard .dtop{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.defcard b{font-family:var(--serif);font-size:1.15rem}
.defcard span{color:var(--muted);font-size:.94rem;line-height:1.45}
.vrow{display:flex;gap:.45rem;align-items:stretch}
.vsay{width:3rem;border-radius:.9rem;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.vtap{flex:1;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:.9rem;padding:.6rem .85rem}
.vtap b{font-family:var(--serif);font-size:1.12rem}
.vtap .es{display:none;color:var(--ok);font-weight:650;margin-top:.15rem}
.vtap.on .es{display:block}

.bar{height:.55rem;border-radius:1rem;background:var(--line);overflow:hidden;margin:.4rem 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.stat{margin:0 0 1rem}
.stat div{display:flex;justify-content:space-between;font-size:.95rem}

.fcard{background:var(--card);border:2px solid var(--ink);border-radius:1.3rem;padding:.95rem;text-align:center;cursor:pointer;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.imgbox{aspect-ratio:16/10;border-radius:.9rem;overflow:hidden;margin-bottom:.8rem;background:repeating-linear-gradient(135deg,var(--f1) 0 14px,var(--f2) 14px 28px);display:grid;place-items:center;color:var(--muted);font-size:.82rem;padding:.5rem}
.imgbox img{width:100%;height:100%;object-fit:cover;display:block}
.fcard .en{font-family:var(--serif);font-size:1.9rem;font-weight:650;line-height:1.25}
.fcard .es{display:none;font-size:1.4rem;margin-top:.4rem;color:var(--ok);font-weight:650}
.fcard.flipped .es{display:block}
.fcard.flipped .tap{display:none}
.tap{color:var(--muted);font-size:.85rem;margin-top:.4rem}
.ans{display:none;gap:.6rem;margin-top:.9rem}
.fcard.flipped+.ans{display:flex}
.ans .btn{flex:1}

.opts{display:grid;gap:.55rem;margin-top:1rem}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:.9rem;padding:.8rem .9rem;font-size:1.05rem}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}

.blk{display:grid;width:100%;text-align:left;gap:.1rem;background:var(--card);border:1.5px solid var(--line);border-radius:1rem;padding:.7rem .9rem;margin-bottom:.55rem}
.blk small{color:var(--muted)}
.seg{display:flex;gap:.4rem;margin:.5rem 0;flex-wrap:wrap}
.seg button{flex:1;min-width:4.5rem;padding:.55rem .4rem;border:2px solid var(--line);border-radius:.8rem;background:var(--card);font-weight:650;font-size:.88rem}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.dots{display:flex;gap:.25rem;margin:.4rem 0 1rem}
.dots i{flex:1;height:1.4rem;border-radius:.3rem;background:var(--line)}
.dots i.on{background:var(--ok)}
.field{display:grid;gap:.35rem;margin:.75rem 0}
.field label{font-size:.88rem;font-weight:650}
.krow{display:flex;gap:.4rem;align-items:center}
.krow .knum{min-width:2.3rem;height:2.85rem;border-radius:.75rem;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:750;font-size:.82rem}
.krow .knum.on{border-color:var(--amber);background:var(--amber);color:var(--amber-ink)}
.status{list-style:none;padding:0!important;margin:.3rem 0 .8rem}
.status li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:.35rem 0;font-size:.93rem}
.status .y{color:var(--ok);font-weight:650} .status .n{color:var(--bad);font-weight:650}
.callout{background:var(--card);border-left:4px solid var(--amber);border-radius:.6rem;padding:.65rem .85rem;font-size:.9rem;margin:.6rem 0;border:1px solid var(--line);border-left-width:4px}

#sheet,#kmodal{position:fixed;inset:0;display:none;z-index:20}
#sheet.open,#kmodal.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,15,20,.55);backdrop-filter:blur(2px)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:36rem;margin:0 auto;background:var(--card);border-radius:1.4rem 1.4rem 0 0;padding:1rem 1.1rem calc(1rem + env(safe-area-inset-bottom));max-height:90%;overflow:auto;border-top:2px solid var(--ink)}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.x{width:2.4rem;height:2.4rem;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.mbtn{min-height:5.1rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;font-weight:650;font-size:.82rem;padding:.4rem;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.mbtn svg{width:1.5rem;height:1.5rem}
.mbtn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:6.4rem;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.55rem .95rem;border-radius:.85rem;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:35;max-width:92%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.22)}
#toast.on{opacity:1}
.pr-card{background:var(--card);border:2px solid var(--ink);border-radius:1.2rem;padding:1rem;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.pr-target{font-family:var(--serif);font-size:1.55rem;line-height:1.45;margin:.8rem 0}
.pr-mic{width:4.8rem;height:4.8rem;border-radius:50%;border:3px solid var(--ink);background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;margin:1rem auto;font-size:1.8rem;box-shadow:0 3px 0 var(--ink)}
.pr-mic.recording{background:var(--bad);color:#fff;animation:prpulse 1s infinite}
.pr-mic:disabled{opacity:.45;animation:none}
.pr-meter{height:.7rem;border-radius:1rem;background:var(--line);overflow:hidden;margin:.7rem 0}.pr-meter i{display:block;height:100%;background:var(--ok);width:0}
.pr-score{font-size:2.2rem;font-weight:800;color:var(--ok)}
.pr-item{border-top:1px solid var(--line);padding:.7rem 0}.pr-item:first-child{border-top:0}.pr-item b{display:block}.pr-small{font-size:.86rem;color:var(--muted)}
@keyframes prpulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" data-floor="0" data-mode="library">
  <header id="top">
    <div id="ctx"></div>
    <span id="warn" class="warn hidden">Sin guardado</span>
    <button id="keysBtn" class="tbtn" data-a="openKeys" title="Configurar 5 llaves Gemini IA y Pexels">
      <span id="keysIcon"></span>
      <span>IA</span>
      <span id="kBadge" class="kbadge off">0/5</span>
    </button>
    <button id="themeBtn" class="tbtn" data-a="toggleTheme" title="Cambiar Modo Claro / Oscuro" aria-label="Cambiar tema"></button>
    <div id="prog"><i></i></div>
  </header>
  <main id="stage"><div id="rail"></div></main>
  <nav id="nav">
    <button id="prev" class="nbtn" aria-label="Anterior"></button>
    <button id="menuBtn" data-a="openMenu" aria-label="Abrir menú"></button>
    <button id="next" class="nbtn" aria-label="Siguiente"></button>
  </nav>
</div>

<!-- Menú Principal -->
<div id="sheet">
  <div class="scrim" data-a="closeMenu"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Menú"></div>
</div>

<!-- Modal Rápido para tus 5 Llaves de Gemini Studio + Pexels -->
<div id="kmodal">
  <div class="scrim" data-a="closeKeys"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Llaves API"></div>
</div>

<div id="toast" role="status"></div>
<noscript>Esta app necesita JavaScript.</noscript>

<script type="application/json" id="seed">null</script>

let dbp=null;
function dbOpen(){
  if(dbp)return dbp;
  dbp=new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('sin IndexedDB'));
    const r=indexedDB.open(DBN,3);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');
      if(!db.objectStoreNames.contains('audios'))db.createObjectStore('audios');
      if(!db.objectStoreNames.contains('stories'))db.createObjectStore('stories');
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('bloqueado'));
  }).catch(e=>{dbp=null;throw e});
  return dbp;
}
async function idbGet(){

  catch(e){health.idb=false;return null}
}

function mergeState(b){
  b=normState(b);
  const previous=Array.isArray(state.stories)?state.stories.slice():[];
  state.stories=[];
  previous.forEach(s=>state.stories.push(s));
  b.stories.forEach(s=>{
    let id=String(s.id||slug(s.title));
    const signature=storySignature(s);
    let i=state.stories.findIndex(x=>x.id===id);
    if(i>=0&&storySignature(state.stories[i])!==signature){
      let n=2, candidate=id+'-'+n;
      while(state.stories.some(x=>x.id===candidate))candidate=id+'-'+(++n);
      s=Object.assign({},s,{id:candidate});i=-1;
    }
    if(i>=0)state.stories[i]=s;else state.stories.push(s)
  });
  ['pos','srs','trans','days','img'].forEach(k=>Object.assign(state[k],b[k]));
  for(const id in b.done)state.done[id]=Object.assign(state.done[id]||{},b.done[id]);
  const keepPex=state.settings.pexels;
  const keepGem=state.settings.geminiKeys.slice();
  Object.assign(state.settings,b.settings);
  if(!state.settings.pexels&&keepPex)state.settings.pexels=keepPex;
  if(!state.settings.geminiKeys.some(Boolean)&&keepGem.some(Boolean))state.settings.geminiKeys=keepGem;
  state.last=b.last||state.last;
  save();
}

/* ---------- historias ---------- */
function normStory(raw){
  if(!raw||!Array.isArray(raw.blocks))return null;
  const blocks=raw.blocks.map((b,bi)=>{
    const sents=((b&&b.sentences)||[]).map(s=>{
      const voc=(((s&&s.vocabulary)||[]).filter(v=>v&&v.en)).map(v=>{
        const prompt=String(v.img_prompt||v.en);
        if(v.cached_img_url&&!state.img[prompt])state.img[prompt]=v.cached_img_url;
        return {en:String(v.en),es:String(v.es||''),img:prompt};
      });
      return {
        text:String((s&&s.original_sentence)||'').trim(),
        defs:(((s&&s.layer1&&s.layer1.definitions)||[]).filter(d=>d&&d.term)).map(d=>({term:String(d.term),def:String(d.definition||'')})),
        idea:String((s&&s.layer1&&s.layer1.basic_idea)||''),
        story:String((s&&s.layer2&&s.layer2.full_story)||''),
        says:String((s&&s.layer2&&s.layer2.so_the_sentence_says)||''),
        vocab:voc
      };
    }).filter(s=>s.text);
    return {
      title:String((b&&b.block_title)||('Bloque '+(bi+1))).replace(/^\s*Block\s*\d+\s*:\s*/i,'').trim(),
      sentences:sents,
      ref:String((b&&b.evaluation_guide&&b.evaluation_guide.reference_spanish)||''),
      notes:Array.isArray(b&&b.evaluation_guide&&b.evaluation_guide.grammar_notes)?b.evaluation_guide.grammar_notes.map(String):[]
    };
  }).filter(b=>b.sentences.length);
  if(!blocks.length)return null;
  const title=String(raw.story_title||'Historia sin título').trim();
  const baseId=slug(title);
  const sameBase=state.stories.find(x=>x.id===baseId&&x.title===title);
  const fingerprint=JSON.stringify(raw.blocks||[]);
  let hash=2166136261;for(let i=0;i<fingerprint.length;i++){hash^=fingerprint.charCodeAt(i);hash=Math.imul(hash,16777619)}
  let id=raw.id||(sameBase?baseId:baseId+'-'+(hash>>>0).toString(36));
  const incomingSignature=JSON.stringify({title,blocks});
  const collision=state.stories.find(x=>x.id===id);
  if(collision&&storySignature(collision)!==incomingSignature){
    const root=id;let n=2;id=root+'-'+n;
    while(state.stories.some(x=>x.id===id))id=root+'-'+(++n);
  }
  if(raw.done_sentences&&typeof raw.done_sentences==='object'){
    state.done[id]=Object.assign(state.done[id]||{},raw.done_sentences);
  }
  if(raw.srs_progress&&typeof raw.srs_progress==='object'){
    Object.assign(state.srs,raw.srs_progress);
  }
  raw.blocks.forEach((b,bi)=>{
    if(b&&b.user_translation&&b.user_translation.text){
      state.trans[id+':'+bi]=b.user_translation;
    }
  });
  return {id,title,blocks,addedAt:Date.now()};
}
function storySignature(s){return JSON.stringify({title:String(s&&s.title||''),blocks:(s&&s.blocks)||[]})}
const S=id=>state.stories.find(s=>s.id===id);
const totalSent=s=>s.blocks.reduce((n,b)=>n+b.sentences.length,0);
const doneCount=s=>Object.keys(state.done[s.id]||{}).length;
const vocabCount=s=>cardsFor(s.id).length;
function cardsFor(scope){
  const out=[],seen=new Set();
  state.stories.filter(s=>scope==='all'||s.id===scope).forEach(s=>s.blocks.forEach(b=>b.sentences.forEach(x=>x.vocab.forEach(v=>{
    const key=s.id+'::'+v.en.toLowerCase();
    if(seen.has(key))return;seen.add(key);
    out.push({key,en:v.en,es:v.es,img:v.img,sid:s.id});
  }))));
  return out;
}

function b64ToBytes(b64){
  const bin=atob(b64),len=bin.length,out=new Uint8Array(len);
  for(let i=0;i<len;i++)out[i]=bin.charCodeAt(i);
  return out;
}
function pcm16ToWav(pcmBytes,sampleRate=24000){
  const buf=new ArrayBuffer(44+pcmBytes.length);
  const v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+pcmBytes.length,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');
  v.setUint32(40,pcmBytes.length,true);
  new Uint8Array(buf).set(pcmBytes,44);
  return new Blob([buf],{type:'audio/wav'});
}

function validGeminiKeys(){
  const list=[];
  const start=state.settings.activeGeminiIdx||0;
  for(let i=0;i<5;i++){
    const idx=(start+i)%5;
    const k=(state.settings.geminiKeys[idx]||'').trim();
    if(k)list.push({key:k,idx});
  }
  return list;
}

async function fetchGeminiAudioBlob(text){
  const cleanText=String(text||'').replace(/\s+/g,' ').trim();
  const voice=state.settings.geminiVoice||'Kore';
  const cached=await idbGetAudio(cleanText,voice);
  if(cached)return {blob:cached,cached:true};

  const attempts=validGeminiKeys();
  if(!attempts.length)throw new Error('NO_KEYS');

  const model=state.settings.geminiModel||'gemini-2.5-flash-preview-tts';
  let lastErr=null;

  for(let a=0;a<attempts.length;a++){
    const cur=attempts[a];
    const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(cur.key);
    try{
      const r=await fetch(url,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          contents:[{parts:[{text:cleanText}]}],
          generationConfig:{
            responseModalities:['AUDIO'],
            speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voice}}}
          }
        })
      });
      if(r.status===429||r.status===403||r.status===503||r.status===400){
        const nxt=attempts[a+1];
        if(nxt){
          state.settings.activeGeminiIdx=nxt.idx;save();
          toast('Llave '+(cur.idx+1)+' falló ('+r.status+'), rotando a Llave '+(nxt.idx+1)+'…');
          continue;
        }
        throw new Error('Cuota o llave inválida en Gemini ('+r.status+')');
      }
      if(!r.ok){
        const ej=await r.json().catch(()=>({}));
        throw new Error((ej.error&&ej.error.message)||('Error HTTP '+r.status));
      }
      const j=await r.json();
      const part=(((j.candidates||[])[0]||{}).content||{}).parts||[];
      const inline=(part.find(p=>p.inlineData)||{}).inlineData;
      if(!inline||!inline.data)throw new Error('Respuesta sin audio');
      state.settings.activeGeminiIdx=cur.idx;save();

      const bytes=b64ToBytes(inline.data);
      const mime=String(inline.mimeType||'').toLowerCase();
      let blob;
      if(mime.includes('wav')||mime.includes('mp3')||mime.includes('mpeg')||mime.includes('ogg')){
        blob=new Blob([bytes],{type:inline.mimeType});
      }else{
        const rm=mime.match(/rate=(\d+)/);
        blob=pcm16ToWav(bytes,rm?parseInt(rm[1],10):24000);
      }
      await idbSetAudio(cleanText,voice,blob);
      return {blob,cached:false,keyIdx:cur.idx};
    }catch(err){
      lastErr=err;
      if(a<attempts.length-1){
        state.settings.activeGeminiIdx=attempts[a+1].idx;save();
      }
    }
  }
  throw lastErr||new Error('Fallo Gemini TTS');
}

/* Generador por lotes: genera todos los audios de una historia (frases, definiciones, ideas, historias, resúmenes y vocabulario) */
let batchBusy=false;
let batchCancel=false;
async function generateAllStoryAudios(sid,btnEl){
  if(batchBusy){
    batchCancel=true;
    toast('Deteniendo generación de audios…');
    return;
  }
  const s=S(sid);if(!s)return;
  if(!validGeminiKeys().length){
    toast('Primero pega al menos 1 llave de Gemini Studio');
    openKeysModal();
    return;
  }
  const texts=[],seen=new Set();
  const push=t=>{t=String(t||'').replace(/\s+/g,' ').trim();if(t&&!seen.has(t.toLowerCase())){seen.add(t.toLowerCase());texts.push(t)}};
  s.blocks.forEach(b=>{
    b.sentences.forEach(x=>{
      push(x.text);
      x.defs.forEach(d=>{push(d.term);push(d.def)});
      push(x.idea);
      push(x.story);
      push(x.says);
      x.vocab.forEach(v=>push(v.en));
    });
  });

  batchBusy=true;
  batchCancel=false;
  const origHtml=btnEl?btnEl.innerHTML:'';
  let done=0;
  try{
    for(let i=0;i<texts.length;i++){
      if(batchCancel)break;
      if(btnEl&&btnEl.isConnected)btnEl.innerHTML=ic('spark')+'Generando ('+(i+1)+'/'+texts.length+') · Toca para parar';
      await fetchGeminiAudioBlob(texts[i]);
      done++;
    }
    toast(batchCancel?('Pausado: '+done+' de '+texts.length+' audios listos'):('¡Listo! '+done+' audios IA guardados en este navegador'));
  }catch(e){
    toast('Generados '+done+' de '+texts.length+' ('+e.message+')');
  }finally{
    batchBusy=false;
    batchCancel=false;
    if(btnEl&&btnEl.isConnected)btnEl.innerHTML=origHtml;
    rerender();
  }
}

/* Unir todos los audios WAV de las frases de una historia en un solo archivo .WAV descargable */
async function downloadStoryCombinedWav(sid,btnEl){
  const s=S(sid);if(!s)return;
  const voice=state.settings.geminiVoice||'Kore';
  const sentences=[];
  s.blocks.forEach(b=>b.sentences.forEach(x=>{
    sentences.push(x.text);
    if(x.says)sentences.push(x.says);
  }));
  if(!sentences.length)return;
  if(btnEl)btnEl.classList.add('busy');
  try{
    const pcmChunks=[];
    let totalLen=0;
    const silence=new Uint8Array(24000*2*0.45); // 450ms de pausa entre oraciones (24kHz 16-bit mono)
    for(let i=0;i<sentences.length;i++){
      const txt=String(sentences[i]||'').replace(/\s+/g,' ').trim();
      let blob=await idbGetAudio(txt,voice);
      if(!blob&&validGeminiKeys().length){
        const r=await fetchGeminiAudioBlob(txt);
        blob=r.blob;
      }
      if(!blob)continue;
      const ab=await blob.arrayBuffer();
      if(ab.byteLength>44){
        const pcm=new Uint8Array(ab,44);
        pcmChunks.push(pcm);
        pcmChunks.push(silence);
        totalLen+=pcm.length+silence.length;
      }
    }
    if(!totalLen){
      toast('Primero genera los audios IA de la historia');
      return;
    }
    const merged=new Uint8Array(totalLen);
    let offset=0;
    pcmChunks.forEach(c=>{merged.set(c,offset);offset+=c.length});
    const wavBlob=pcm16ToWav(merged,24000);
    const u=URL.createObjectURL(wavBlob);
    const a=document.createElement('a');
    a.href=u;a.download=s.id+'-audios-ia.wav';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Audio WAV completo descargado');
  }catch(e){
    toast('Error al unir audios: '+(e.message||e));
  }finally{
    if(btnEl)btnEl.classList.remove('busy');
  }
}

/* ---------- términos subrayados ---------- */
function markTerms(text,defs){
  const low=text.toLowerCase().replace(/[’‘]/g,"'");const spans=[];
  const isW=c=>/[a-z0-9]/i.test(c||' ');
  defs.forEach((d,di)=>{
    const raw=d.term.toLowerCase().replace(/[’‘]/g,"'").replace(/^['"“]+|['"”]+$/g,'').trim();
    const candidates=[raw];
    if(raw.startsWith('to ')&&raw.length>5)candidates.push(raw.slice(3).trim());
    let matched=false;
    for(let c=0;c<candidates.length&&!matched;c++){
      const t=candidates[c];
      if(t.length<2)continue;
      let from=0,i;
      while((i=low.indexOf(t,from))>=0){
        const j=i+t.length;
        if(!isW(low[i-1])&&!isW(low[j])&&!spans.some(s=>i<s.j&&j>s.i)){spans.push({i,j,di});matched=true;break}
        from=i+1;
      }
    }
  });
  spans.sort((a,b)=>a.i-b.i);
  let out='',p=0;
  spans.forEach(s=>{out+=esc(text.slice(p,s.i))+'<button class="term" data-a="term" data-d="'+s.di+'">'+esc(text.slice(s.i,s.j))+'</button>';p=s.j});
  return out+esc(text.slice(p));
}

R.sent=sl=>{
  const s=S(ui.sid),x=s.blocks[sl.bi].sentences[sl.si];
  const sm='<p class="sent sm">'+esc(x.text)+'</p>';
  switch(sl.f){
    case 0:
      return '<h2>1. Lee la frase</h2><p class="sent">'+markTerms(x.text,x.defs)+'</p>'+
        '<div class="row">'+say(x.text,'Escuchar frase')+say(x.text,'Despacio',true)+'</div>'+
        '<div id="tnote" class="note">Toca las palabras subrayadas para escuchar y ver su definición.</div>';
    case 1:{
      const allDefsText=x.defs.map(d=>d.term+'. '+d.def).join(' ');
      return '<h2>2. Palabras clave (Andamiaje)</h2>'+sm+
        (x.defs.length?'<div class="row">'+say(allDefsText,'Escuchar todas las definiciones')+'</div>':'')+
        '<ul class="defs">'+(x.defs.map(d=>
          '<li class="defcard"><div class="dtop"><b>'+esc(d.term)+'</b><div class="row" style="margin:0">'+
          say(d.term,'Término')+say(d.def,'Explicación')+'</div></div><span>'+esc(d.def)+'</span></li>'
        ).join('')||'<li class="muted">Esta frase no trae palabras difíciles.</li>')+'</ul>';
    }
    case 2:
      return '<h2>3. Idea básica</h2>'+sm+
        '<p class="big">'+esc(x.idea)+'</p>'+
        '<div class="row">'+say(x.idea,'Escuchar idea básica')+say(x.idea,'Despacio',true)+'</div>';
    case 3:{
      const cleanStory=x.story.replace(/\n+/g,' ');
      return '<h2>4. La historia completa</h2>'+
        '<div class="row">'+say(cleanStory,'Escuchar historia')+say(cleanStory,'Despacio',true)+'</div>'+
        '<div class="story">'+x.story.split(/\n+/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';
    }
    default:
      return '<h2>5. En palabras simples</h2><p class="big">'+esc(x.says)+'</p>'+sm+
        '<div class="row">'+say(x.says,'Escuchar resumen')+say(x.says,'Despacio',true)+say(x.text,'Frase original')+'</div>'+
        '<p><span class="chip ok">Frase completada</span></p><p class="muted">Piensa cómo la dirías en español y sigue.</p>';
  }
};

A.pstart=()=>{
  const cs=cardsFor(ui.scope),all=cardsFor('all');
  const pick=shuffle(cs.map(c=>({c,r:Math.random()+cardState(c.key).box*1.5})).sort((a,b)=>a.r-b.r).slice(0,10).map(x=>x.c));
  const kinds=['choose','listen','type'];
  const qs=pick.map((c,i)=>{
    let k=kinds[i%3];
    const dis=shuffle(all.filter(x=>x.key!==c.key&&x.es!==c.es&&x.en!==c.en)).slice(0,3);
    if(k!=='type'&&dis.length<2)k='type';
    const f=k==='choose'?'es':'en';
    return {t:'q',k,card:c,opts:k==='type'?[]:shuffle([c].concat(dis)).map(x=>x[f]),correct:k==='type'?c.en:c[f]};
  });
  ui.score={ok:0,n:0};
  setDeck('practice',qs.concat([{t:'pdone'}]),0);
};
R.q=sl=>{
  const c=sl.card;const qs=ui.deck.filter(x=>x.t==='q');const idx=qs.indexOf(sl)+1;
  const opts=()=>'<div class="opts">'+sl.opts.map((o,i)=>{
    let cl='opt';if(sl.done){if(o===sl.correct)cl+=' ok';else if(i===sl.pick)cl+=' bad'}
    return '<button class="'+cl+'" data-a="qopt" data-i="'+i+'"'+(sl.done?' disabled':'')+'>'+esc(o)+'</button>';
  }).join('')+'</div>';
  const fb=()=>sl.done?'<p class="'+(sl.ok?'msg good':'msg bad')+'">'+(sl.ok?'¡Bien!':'Era: '+esc(c.en)+' = '+esc(c.es))+'</p>':'';
  let h='<p class="muted sm">Pregunta '+idx+' de '+qs.length+'</p>';
  if(sl.k==='choose')h+='<h2>¿Qué significa?</h2><p class="big">'+esc(c.en)+'</p><div class="row">'+say(c.en)+'</div>'+opts()+fb();
  else if(sl.k==='listen')h+='<h2>¿Qué palabra escuchaste?</h2><div class="row"><button class="btn pri" data-a="say" data-t="'+esc(c.en)+'">'+ic('vol')+'Escuchar</button><button class="btn" data-a="say" data-t="'+esc(c.en)+'" data-slow="1">Despacio</button></div>'+opts()+fb();
  else h+='<h2>Escríbela en inglés</h2><p class="big">'+esc(c.es)+'</p><div class="row">'+say(c.en,'Escuchar pista')+'</div><p class="muted">Empieza con «'+esc(c.en[0])+'» · '+c.en.length+' caracteres</p>'+
    '<input id="qin" class="ta one" type="text" data-in="qin" autocomplete="off" autocapitalize="none" spellcheck="false" value="'+esc(sl.ans||'')+'"'+(sl.done?' disabled':'')+'>'+
    (sl.done?'':'<div class="row"><button class="btn pri" data-a="qcheck">Comprobar</button></div>')+fb()+(sl.done&&sl.near?'<p class="muted sm">Casi: revisa la ortografía.</p>':'');
  return h;
};

A.qcheck=()=>{

function parseJsonText(text){
  let t=String(text).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  const a=t.search(/[\[{]/);if(a<0)throw new Error('No encontré JSON en el texto.');
  const closeChar=t[a]==='['?']':'}';
  const z=t.lastIndexOf(closeChar);
  if(z<a)throw new Error('El JSON está incompleto (falta cerrar con '+closeChar+').');
  t=t.slice(a,z+1);
  try{return JSON.parse(t)}catch(e){throw new Error('El JSON tiene un error: '+e.message)}
}
function importText(text){
  const o=parseJsonText(text);
  if(validState(o)){mergeState(o);return {restored:true}}
  const list=Array.isArray(o)?o:(Array.isArray(o.stories)?o.stories:[o]);
  const added=[];
  list.forEach(raw=>{
    const s=normStory(raw);
    if(!s)throw new Error('A la historia le faltan los bloques (blocks) o las frases (sentences).');
    const i=state.stories.findIndex(x=>x.id===s.id);
    if(i>=0)state.stories[i]=s;else state.stories.push(s);
    added.push(s);
  });
  state.last=added[0].id;save();
  return {added};
}

/* ---------- eventos ---------- */
let swiped=false,sx=0,sy=0,sw=false;
document.addEventListener('click',e=>{
  if(swiped){e.preventDefault();e.stopPropagation();return}
  const el=e.target.closest('[data-a]');if(!el)return;
  const f=A[el.dataset.a];if(f)f(el,e);
},true);
const stage=$('#stage');
stage.addEventListener('pointerdown',e=>{if(e.target.closest('textarea,input,select')){sw=false;return}sx=e.clientX;sy=e.clientY;sw=true});
stage.addEventListener('pointercancel',()=>{sw=false});
stage.addEventListener('pointerup',e=>{
  if(!sw)return;sw=false;
  if(window.getSelection&&String(window.getSelection()).trim().length>0)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6){swiped=true;setTimeout(()=>{swiped=false},320);dx<0?next():prev()}
});
$('#prev').addEventListener('click',prev);
$('#next').addEventListener('click',next);
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('textarea,input,select'))return;
  if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape'){closeMenu();closeKeysModal()}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='imp')ui.draft=v;
  else if(k==='qin'){const sl=ui.deck[ui.i];if(sl)sl.ans=v}
  else if(k==='tr'){const sl=ui.deck[ui.i];const key=transKey(sl.bi);const t=state.trans[key]||(state.trans[key]={});t.text=v;t.at=Date.now();save()}
  else if(k==='rate'){state.settings.rate=+v;save();const r=$('#rateV');if(r)r.textContent=(+v).toFixed(2)+'×'}
  else if(k==='fs'){state.settings.fs=Math.max(.85,Math.min(1.25,+v||1));applyLook();save();const r=$('#fsV');if(r)r.textContent=Math.round(state.settings.fs*100)+'%'}
  else if(k==='pexels'){state.settings.pexels=v.trim();save()}
  else if(k==='gkey'){const idx=+e.target.dataset.i;state.settings.geminiKeys[idx]=v.trim();save()}
  else if(k==='ttsurl'){state.settings.ttsFallbackUrl=v.trim();save()}
  else if(k==='ttskey'){state.settings.ttsFallbackKey=v.trim();save()}
  else if(k==='azureKey'){state.settings.azureSpeechKey=v.trim();save()}
  else if(k==='azureRegion'){state.settings.azureSpeechRegion=v.trim();save()}
  else if(k==='openPronounceUrl'){state.settings.openPronounceUrl=v.trim();save()}
  else if(k==='prKind'){ui.prKind=v}
  else if(k==='prCount'){ui.prCount=v}
});
document.addEventListener('change',e=>{
  const t=e.target;const k=t.dataset&&t.dataset.in;
  if(k==='voice'){state.settings.voice=t.value;save()}
  else if(k==='theme'){state.settings.theme=['light','dark','auto'].includes(t.value)?t.value:'light';applyLook();save();toast('Tema actualizado')}
  else if(k==='gvoice'){state.settings.geminiVoice=t.value;save();toast('Voz IA: '+t.value)}
  else if(k==='auto'){state.settings.autoSpeak=t.checked;save()}
  else if(k==='usegem'){state.settings.useGeminiTTS=t.checked;save()}
  else if(k==='pronProvider'){state.settings.pronunciationProvider=['openpronounce','azure','gemini'].includes(t.value)?t.value:'openpronounce';save();toast('Evaluador: '+(t.value==='openpronounce'?'OpenPronounce local':t.value==='azure'?'Azure':'Gemini'))}
  else if(t.id==='impFile'){const f=t.files[0];if(f&&/\.zip$/i.test(f.name))f.arrayBuffer().then(importZip).then(n=>{toast('ZIP restaurado ('+n+' audios)');openLibrary()}).catch(err=>toast(err.message));else readFile(f,txt=>{ui.draft=txt;doImport(txt)})}
  else if(t.id==='restoreFile'){const f=t.files[0];if(f&&/\.zip$/i.test(f.name))f.arrayBuffer().then(importZip).then(n=>{toast('ZIP restaurado ('+n+' audios)');openLibrary()}).catch(err=>toast(err.message));else readFile(f,txt=>{try{const o=parseJsonText(txt);if(!validState(o))throw new Error('Ese archivo no es un respaldo de Andamio.');mergeState(o);toast('Respaldo restaurado');openLibrary()}catch(err){toast(err.message)}})};
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
window.addEventListener('pagehide',()=>{flush()});
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='auto')applyLook()})}catch(e){}}
